name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check xnp tests xnp.py

      - name: Test
        # No test may reach the network; the startup version check is disabled.
        env:
          XNP_NO_UPDATE_CHECK: "1"
        run: pytest --cov=xnp --cov-report=term-missing --cov-fail-under=90

      - name: Smoke test the installed entry point
        env:
          XNP_NO_UPDATE_CHECK: "1"
        run: |
          cd "$(mktemp -d)"
          xnp --version
          xnp -f "$GITHUB_WORKSPACE/tests/fixtures/single_host.xml" -oF csv
          test -f "$GITHUB_WORKSPACE/tests/fixtures/single_host.csv"
