<!DOCTYPE html>
<html lang="{{LANG}}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="Xtreme Nmap Parser {{VERSION}}">
<title>{{TITLE}}</title>
<style>{{FONTS}}</style>
<style>{{CSS}}</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <h1 id="brand-title">{{TITLE}}</h1>
      <span class="tag">xnp {{VERSION}}</span>
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-summary" role="tab" aria-selected="true" type="button" data-i18n="tab.summary"></button>
      <button id="tab-targets" role="tab" aria-selected="false" type="button" data-i18n="tab.targets"></button>
      <button id="tab-data" role="tab" aria-selected="false" type="button" data-i18n="tab.data"></button>
    </div>
    <div class="switches">
      <select id="lang-select" aria-label="Idioma / Language" data-i18n-aria="lang.select">
        <option value="es">ES</option>
        <option value="en">EN</option>
      </select>
      <button id="theme-btn" type="button"></button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="bar">
    <div class="query">
      <span class="prompt">&gt;</span>
      <label for="q" style="position:absolute;left:-9999px" data-i18n="q.placeholder"></label>
      <input id="q" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="q.placeholder">
      <span class="count" id="count"></span>
      <div id="suggest" hidden role="listbox" data-i18n-aria="a11y.suggestions"></div>
    </div>
    <!-- The query language is worth explaining once and then getting out of
         the way, so its paragraph lives behind this. -->
    <button id="hint-toggle" type="button" class="icon-btn" aria-expanded="false"
            aria-controls="hint" data-i18n-aria="a11y.hint_toggle">
      <svg viewBox="0 0 16 16" aria-hidden="true" width="14" height="14" fill="currentColor">
        <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 14.5A6.5 6.5 0 1 1 8 1.5a6.5 6.5
        0 0 1 0 13zM7.1 6.6h1.8v6H7.1v-6zM8 3.2a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1
        0-2.1z"/>
      </svg>
    </button>
    <button id="reset" type="button" data-i18n="btn.clear"></button>
  </div>

  <p class="hint" id="hint" data-i18n-html="hint" hidden></p>

  <section id="panel-summary" class="panel active" role="tabpanel">
    <div id="kpis" class="kpis"></div>
    <div class="charts">
      <div class="card" id="card-tags"><h2 data-i18n="chart.tags"></h2><div class="chart-box"><canvas id="chart-tags"></canvas></div></div>
      <div class="card" id="card-states"><h2 data-i18n="chart.states"></h2><div class="chart-box"><canvas id="chart-states"></canvas></div></div>
      <div class="card" id="card-services"><h2 data-i18n="chart.services"></h2><div class="chart-box"><canvas id="chart-services"></canvas></div></div>
      <div class="card" id="card-ports"><h2 data-i18n="chart.ports"></h2><div class="chart-box"><canvas id="chart-ports"></canvas></div></div>
      <div class="card" id="card-hosts"><h2 data-i18n="chart.hosts"></h2><div class="chart-box"><canvas id="chart-hosts"></canvas></div></div>
      <div class="card" id="card-os"><h2 data-i18n="chart.os"></h2><div class="chart-box"><canvas id="chart-os"></canvas></div></div>
    </div>
  </section>

  <section id="panel-targets" class="panel" role="tabpanel">
    <div class="targets-bar">
      <label for="group-by" data-i18n="targets.groupBy"></label>
      <select id="group-by">
        <option value="service" selected data-i18n="group.service"></option>
        <option value="product" data-i18n="group.product"></option>
        <option value="num" data-i18n="group.num"></option>
        <option value="ip" data-i18n="group.ip"></option>
        <option value="osFamily" data-i18n="group.osFamily"></option>
      </select>
      <span id="groups-summary"></span>
      <span class="grow"></span>
      <!-- The profiles are populated from the payload: they come from the
           reader's own config.yaml, and empty options keep prose out of the
           markup. -->
      <span class="rescan">
        <select id="rescan-profile" class="rescan-profile" data-i18n-aria="rescan.profile"></select>
        <button type="button" class="rescan-copy"></button>
      </span>
      <span class="rescan-copied g-copied" data-i18n="targets.copied" hidden></span>
      <input id="rescan-args" class="rescan-args" type="text"
             data-i18n-ph="rescan.argsPlaceholder" hidden>
      <span class="rescan-hint" hidden></span>
      <button id="export-targets" type="button" data-i18n="targets.exportAll"></button>
    </div>
    <p class="hint targets-hint" data-i18n="targets.hint"></p>
    <div id="groups"></div>
  </section>

  <section id="panel-data" class="panel" role="tabpanel">
    <div id="active-filters" class="active-filters" hidden></div>
    <div class="table-card">
      <div class="table-tools">
        <span style="font-size:12px;color:var(--text-3)" data-i18n="table.hint"></span>
        <span class="grow"></span>
        <span class="rescan">
          <select id="data-rescan-profile" class="rescan-profile" data-i18n-aria="rescan.profile"></select>
          <button type="button" class="rescan-copy"></button>
        </span>
        <span class="rescan-copied g-copied" data-i18n="targets.copied" hidden></span>
        <input id="data-rescan-args" class="rescan-args" type="text"
               data-i18n-ph="rescan.argsPlaceholder" hidden>
        <span class="rescan-hint" hidden></span>
        <button id="csv" type="button" data-i18n="table.csv"></button>
      </div>
      <div class="table-scroll" id="table-scroll">
        <table>
          <thead><tr id="thead-row"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <footer>
    <div class="meta" id="meta"></div>
    <span id="foot-generated"></span>
    <a class="foot-repo" href="https://github.com/xtormin/XtremeNmapParser"
       target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" aria-hidden="true" width="13" height="13" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
        1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
        0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0
        1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0
        3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0
        .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span data-i18n="foot.repo"></span>
    </a>
  </footer>
</div>

<div id="tip" class="tip" style="display:none"></div>

<div id="filter-menu" hidden role="dialog" data-i18n-aria="a11y.filter_menu">
  <div class="fm-head">
    <span id="fm-title"></span>
    <span id="fm-count"></span>
  </div>
  <input id="fm-search" type="search" spellcheck="false" autocomplete="off" data-i18n-ph="fm.search">
  <div class="fm-actions">
    <button id="fm-all" type="button" data-i18n="fm.all"></button>
    <button id="fm-only" type="button" data-i18n="fm.only"></button>
  </div>
  <div id="fm-list"></div>
</div>

<div id="drawer-scrim"></div>
<aside id="drawer" aria-hidden="true" data-i18n-aria="a11y.drawer">
  <header>
    <div class="titles">
      <h2 id="drawer-title"></h2>
      <p id="drawer-sub"></p>
    </div>
    <span id="drawer-interest" class="pill low"></span>
    <button id="drawer-close" type="button" data-i18n-aria="drawer.close">✕</button>
  </header>
  <div id="drawer-body"></div>
</aside>

<script id="xnp-data" type="application/json">{{PAYLOAD}}</script>
<script>window.XNP_DATA = JSON.parse(document.getElementById("xnp-data").textContent);</script>
<script>{{CHARTJS}}</script>
<script>{{JS}}</script>
</body>
</html>
